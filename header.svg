<svg width="100%" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');

      .bg {
        fill: #0B0F19;
      }
      
      .char {
        font-family: 'JetBrains Mono', monospace;
        font-size: 50px;
        font-weight: 800;
        fill: #FFFFFF;
        cursor: pointer;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.25s ease;
      }

      .char:hover {
        transform: translateY(-16px) scale(1.2);
        fill: #38BDF8;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" rx="12" class="bg" />

  <!-- Hover Interactive Title with Fixed Character Spacing -->
  <g transform="translate(425, 125)">
    <text text-anchor="middle" dominant-baseline="middle">
      <tspan class="char" x="-280">H</tspan>
      <tspan class="char" x="-235">A</tspan>
      <tspan class="char" x="-190">R</tspan>
      <tspan class="char" x="-145">S</tspan>
      <tspan class="char" x="-100">H</tspan>
      <tspan class="char" x="-55">A</tspan>
      <tspan class="char" x="-10">L</tspan>
      <tspan class="char" x="40">S</tspan>
      <tspan class="char" x="85">H</tspan>
      <tspan class="char" x="130">A</tspan>
      <tspan class="char" x="175">H</tspan>
    </text>
  </g>
</svg>
