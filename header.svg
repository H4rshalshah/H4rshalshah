<svg width="100%" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');

      .bg {
        fill: #0B0F19;
      }
      
      .char {
        font-family: 'JetBrains Mono', monospace;
        font-size: 50px;
        font-weight: 800;
        fill: #FFFFFF;
        animation: wave 2.4s ease-in-out infinite;
      }

      /* Staggered delays create a continuous, smooth character wave */
      .c1  { animation-delay: 0.0s; }
      .c2  { animation-delay: 0.1s; }
      .c3  { animation-delay: 0.2s; }
      .c4  { animation-delay: 0.3s; }
      .c5  { animation-delay: 0.4s; }
      .c6  { animation-delay: 0.5s; }
      .c7  { animation-delay: 0.6s; }
      .c8  { animation-delay: 0.8s; }
      .c9  { animation-delay: 0.9s; }
      .c10 { animation-delay: 1.0s; }
      .c11 { animation-delay: 1.1s; }

      @keyframes wave {
        0%, 100% {
          transform: translateY(0);
          fill: #FFFFFF;
        }
        50% {
          transform: translateY(-16px);
          fill: #38BDF8;
        }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="12" class="bg" />

  <!-- Smooth Animated Wave Header -->
  <g transform="translate(425, 125)">
    <text text-anchor="middle" dominant-baseline="middle">
      <tspan class="char c1" x="-280">H</tspan>
      <tspan class="char c2" x="-235">A</tspan>
      <tspan class="char c3" x="-190">R</tspan>
      <tspan class="char c4" x="-145">S</tspan>
      <tspan class="char c5" x="-100">H</tspan>
      <tspan class="char c6" x="-55">A</tspan>
      <tspan class="char c7" x="-10">L</tspan>
      <tspan class="char c8" x="40">S</tspan>
      <tspan class="char c9" x="85">H</tspan>
      <tspan class="char c10" x="130">A</tspan>
      <tspan class="char c11" x="175">H</tspan>
    </text>
  </g>
</svg>
